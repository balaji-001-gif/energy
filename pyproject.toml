[project]
name = "energy_utilities"
authors = [
    { name = "Your Company", email = "info@example.com"}
]
description = "Universal Energy & Utilities Operations Suite"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "frappe~=15.0.0",
    "erpnext~=15.0.0"
]

[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.app]
app_name = "energy_utilities"
app_title = "Energy & Utilities"
app_publisher = "Your Company"
app_description = "Universal Energy & Utilities Operations Suite"
app_icon = "lightning"
app_color = "yellow"
app_email = "info@example.com"
app_license = "MIT"
